name: Project quality gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deepdive-quality:
    name: Data + layout + unified audit + browser/WCAG
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEEPDIVE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test runtime
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Exercise failure fixtures
        run: npm run test:quality-gates

      - name: Exercise tooling architecture
        run: npm run test:tooling

      - name: Exercise Stage 2 fixtures
        run: npm run test:stage2

      - name: Exercise video ingestion fixtures
        run: npm run test:video-ingest

      - name: Validate graph, layout, software and tutorials
        run: npm run validate

      - name: Exercise URL routing fixtures
        run: npm run test:routing

      - name: Exercise application in browser
        run: npm run test:app

      - name: Exercise website publication and crawlable coverage
        run: npm run test:website

      - name: Exercise static concept pages
        run: npm run test:static-concepts

      - name: Exercise internationalization and terminology
        run: npm run test:i18n && npm run test:content-i18n && npm run test:terminology

      - name: Exercise remaining CI-ready tests
        run: npm run test:ci-extra

      - name: Enforce deep-dive quality gate
        run: npm run quality:deepdives
