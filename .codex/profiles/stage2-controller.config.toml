approval_policy = "never"
default_permissions = "stage2-controller-no-project-fs"
web_search = "disabled"

[features]
apps = false
hooks = true
multi_agent = true
remote_plugin = false
shell_tool = false
skill_mcp_dependency_install = false

[agents]
max_concurrent_threads_per_session = 1

[[hooks.PreToolUse]]
matcher = ".*"
command = 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File "C:\Users\Lenovo\PycharmProjects\ai_knowledge_map\tools\stage2-codex-tool-guard.ps1"'
command_windows = 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File "C:\Users\Lenovo\PycharmProjects\ai_knowledge_map\tools\stage2-codex-tool-guard.ps1"'
timeout = 5
statusMessage = "Enforcing Stage 2 controller tool allowlist"

[permissions.stage2-controller-no-project-fs]
description = "No project filesystem or network access; Stage 2 access is MCP-only."

[permissions.stage2-controller-no-project-fs.filesystem]
":minimal" = "read"

[permissions.stage2-controller-no-project-fs.network]
enabled = false

[shell_environment_policy]
inherit = "core"
include_only = ["PATH", "PATHEXT", "SYSTEMROOT", "WINDIR", "COMSPEC", "TEMP", "TMP", "STAGE2_MCP_PAGE_ID", "STAGE2_MCP_WORKER_ID", "STAGE2_MCP_ALLOW_PROVISIONAL_PUBLISH"]

[mcp_servers.node_repl]
command = 'C:\Users\Lenovo\AppData\Local\OpenAI\Codex\runtimes\cua_node\fb8898c05a62885e\bin\node_repl.exe'
args = []
enabled = false

[mcp_servers.ai-knowledge-map-stage2]
command = 'D:\AI\node.exe'
args = ['C:\Users\Lenovo\PycharmProjects\ai_knowledge_map\tools\deepdive-stage2\mcp-server.js']
env_vars = ["STAGE2_MCP_PAGE_ID", "STAGE2_MCP_WORKER_ID", "STAGE2_MCP_ALLOW_PROVISIONAL_PUBLISH"]
enabled = true
required = true
enabled_tools = ["stage2_status", "stage2_next_recommended_page", "stage2_resolve_recommended_page", "stage2_enqueue_content_generation", "stage2_import_editorial_candidate", "stage2_finalize_manual_review", "stage2_return_editorial_for_revision", "stage2_rollback_editorial_candidate", "stage2_inspect_publication_candidate", "stage2_publish_provisional_page", "stage2_rollback_provisional_page"]
default_tools_approval_mode = "approve"

[mcp_servers.ai-knowledge-map-stage2.env]
DEEPDIVE_STAGE2_ROOT = 'C:\Users\Lenovo\PycharmProjects\ai_knowledge_map'
STAGE2_MCP_PROFILE = "controller"

