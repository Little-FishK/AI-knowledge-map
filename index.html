<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 知识地图</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div id="app">

  <!-- 顶栏 -->
  <header id="topbar">
    <div class="brand" id="mode-toggle" title="点击切换 概念地图 / 软件目录">
      <span class="brand-mark">◈</span>
      <span class="brand-name" id="brand-name">AI 知识地图</span>
      <span class="brand-ver" id="meta-ver"></span>
      <span class="mode-hint" id="mode-hint">▸ 软件</span>
    </div>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="搜索概念…  （/ 聚焦）" autocomplete="off">
      <div id="search-results"></div>
    </div>
    <div class="topbar-actions">
      <button id="btn-reset" class="btn" title="重置视图">重置</button>
      <button id="btn-panel" class="btn" title="显示/隐藏侧栏">☰</button>
    </div>
  </header>

  <div id="main">

    <!-- 左侧控制栏 -->
    <aside id="controls">
      <section class="ctl-group">
        <h3>视图</h3>
        <p class="ctl-hint">默认只显示各大区的骨干概念<br>点任一节点会揭开它的邻居</p>
        <div class="seg">
          <button data-scope="core" class="on">核心</button>
          <button data-scope="all">全部</button>
        </div>
        <div id="scope-status" class="scope-status"></div>
        <button id="scope-collapse" class="mini wide">收起已展开的</button>
      </section>

      <section class="ctl-group">
        <h3>大区</h3>
        <div id="domain-list"></div>
      </section>

      <section class="ctl-group">
        <h3>关系类型</h3>
        <p class="ctl-hint">跨领域的联系是这张图的重点</p>
        <div class="edge-actions">
          <button class="mini" id="edge-all">全选</button>
          <button class="mini" id="edge-none">全不选</button>
          <button class="mini" id="edge-key">只看关键</button>
        </div>
        <div id="edge-list"></div>
      </section>

      <section class="ctl-group">
        <h3>聚焦</h3>
        <p class="ctl-hint">点节点后只显示其邻域</p>
        <label class="chk"><input type="checkbox" id="focus-on" checked> 聚焦模式</label>
        <label class="range">跳数 <input type="range" id="focus-hops" min="1" max="3" value="1"><b id="hops-val">1</b></label>
      </section>
    </aside>

    <!-- 图 -->
    <main id="stage">
      <div id="cy"></div>
      <div id="legend"></div>
      <div id="empty-hint" class="hidden">没有符合当前筛选的节点</div>
      <div id="software-view" class="hidden"></div>
    </main>

    <!-- 右侧详情 -->
    <aside id="detail" class="closed">
      <button id="detail-close" title="关闭">×</button>
      <div id="detail-body"></div>
    </aside>

  </div>

  <!-- 理解原理（深读页）全屏阅读视图 -->
  <div id="deepdive" class="hidden">
    <header class="dd-top">
      <button id="dd-back" class="dd-back">← 返回详情</button>
      <span id="dd-top-name" class="dd-top-name"></span>
      <button id="dd-close" class="dd-x" title="关闭">×</button>
    </header>
    <div class="dd-scroll"><article id="dd-article"></article></div>
  </div>
</div>

<script src="assets/vendor/cytoscape.min.js"></script>
<script src="assets/vendor/layout-base.js"></script>
<script src="assets/vendor/cose-base.js"></script>
<script src="assets/vendor/cytoscape-fcose.js"></script>
<script src="data/graph.js"></script>
<script src="data/software.js"></script>
<!-- 理解原理深读页：每个概念一个文件，注册到 window.DEEPDIVE[nodeId] -->
<script src="data/deepdive/neural-network.js"></script>
<script src="data/deepdive/llm.js"></script>
<script src="data/deepdive/in-context-learning.js"></script>
<script src="data/deepdive/supervised-learning.js"></script>
<script src="data/deepdive/fine-tuning.js"></script>
<script src="data/deepdive/attention.js"></script>
<script src="data/deepdive/transformer.js"></script>
<script src="data/deepdive/embedding.js"></script>
<script src="data/deepdive/multimodal.js"></script>
<script src="data/deepdive/tool-calling.js"></script>
<script src="data/deepdive/mcp.js"></script>
<script src="data/deepdive/pretraining.js"></script>
<script src="data/deepdive/context-window.js"></script>
<script src="data/deepdive/retrieval.js"></script>
<script src="data/deepdive/rag.js"></script>
<script src="data/deepdive/prompt-engineering.js"></script>
<script src="data/deepdive/cot.js"></script>
<script src="data/deepdive/agent.js"></script>
<script src="data/deepdive/code-generation.js"></script>
<script src="data/deepdive/hallucination.js"></script>
<script src="data/deepdive/prompt-injection.js"></script>
<script src="data/deepdive/alignment.js"></script>
<script src="data/deepdive/diffusion.js"></script>
<script src="data/deepdive/image-generation.js"></script>
<script src="data/deepdive/reasoning-models.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
