<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 知识地图</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div id="app">

  <!-- 顶栏 -->
  <header id="topbar">
    <div class="brand" id="mode-toggle" title="点击切换 概念地图 / 软件目录">
      <span class="brand-mark">◈</span>
      <span class="brand-name" id="brand-name">AI 知识地图</span>
      <span class="brand-ver" id="meta-ver"></span>
      <span class="mode-hint" id="mode-hint">▸ 软件</span>
    </div>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="搜索概念…  （/ 聚焦）" autocomplete="off">
      <div id="search-results"></div>
    </div>
    <div class="topbar-actions">
      <button id="btn-reset" class="btn" title="重置视图">重置</button>
      <button id="btn-panel" class="btn" title="显示/隐藏侧栏">☰</button>
    </div>
  </header>

  <div id="main">

    <!-- 左侧控制栏 -->
    <aside id="controls">
      <section class="ctl-group">
        <h3>视图</h3>
        <p class="ctl-hint">默认只显示各大区的骨干概念<br>点任一节点会揭开它的邻居</p>
        <div class="seg">
          <button data-scope="core" class="on">核心</button>
          <button data-scope="all">全部</button>
        </div>
        <div id="scope-status" class="scope-status"></div>
        <button id="scope-collapse" class="mini wide">收起已展开的</button>
      </section>

      <section class="ctl-group">
        <h3>大区</h3>
        <div id="domain-list"></div>
      </section>

      <section class="ctl-group learning-panel" aria-labelledby="learning-heading">
        <h3 id="learning-heading">学习</h3>
        <div class="learning-overview">
          <div><strong id="learning-done-count">0</strong><span id="learning-total-count"> / 0 个节点</span></div>
          <span id="learning-percent">0%</span>
        </div>
        <div class="learning-progress" aria-hidden="true"><span id="learning-progress-bar"></span></div>
        <button id="official-path-toggle" class="official-path-toggle" type="button" aria-pressed="false">
          <span>✦ 官方推荐</span><em>129 节点 · 9 层</em>
        </button>
        <p id="official-path-note" class="official-path-note hidden">圆心数字表示知识层级，与大区无关。学完某个整数及其全部小数节点，才进入下一个整数层级。</p>
        <details class="learning-group" open>
          <summary>已学习 <em id="learning-done-label">0</em></summary>
          <div id="learning-done-list" class="learning-node-list"></div>
        </details>
        <details class="learning-group">
          <summary>未学习 <em id="learning-todo-label">0</em></summary>
          <div id="learning-todo-list" class="learning-node-list"></div>
        </details>
        <p class="ctl-hint learning-storage-note">进度保存在当前浏览器</p>
      </section>

      <section class="ctl-group">
        <h3>关系类型</h3>
        <p class="ctl-hint">跨领域的联系是这张图的重点</p>
        <div class="edge-actions">
          <button class="mini" id="edge-all">全选</button>
          <button class="mini" id="edge-none">全不选</button>
          <button class="mini" id="edge-key">只看关键</button>
        </div>
        <div id="edge-list"></div>
      </section>

      <section class="ctl-group">
        <h3>聚焦</h3>
        <p class="ctl-hint">点节点后只显示其邻域</p>
        <label class="chk"><input type="checkbox" id="focus-on" checked> 聚焦模式</label>
        <label class="range">跳数 <input type="range" id="focus-hops" min="1" max="3" value="1"><b id="hops-val">1</b></label>
      </section>
    </aside>

    <!-- 图 -->
    <main id="stage">
      <div id="cy"></div>
      <div id="legend"></div>
      <div id="empty-hint" class="hidden">没有符合当前筛选的节点</div>
      <div id="software-view" class="hidden"></div>
    </main>

    <!-- 右侧详情 -->
    <aside id="detail" class="closed">
      <button id="detail-close" title="关闭">×</button>
      <div id="detail-body"></div>
    </aside>

  </div>

  <!-- 理解原理（深读页）全屏阅读视图 -->
  <div id="deepdive" class="hidden">
    <header class="dd-top">
      <button id="dd-back" class="dd-back">← 返回详情</button>
      <span id="dd-top-name" class="dd-top-name"></span>
      <button id="dd-close" class="dd-x" title="关闭">×</button>
    </header>
    <div class="dd-scroll"><article id="dd-article"></article></div>
  </div>
</div>
